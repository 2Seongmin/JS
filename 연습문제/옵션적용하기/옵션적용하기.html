<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옵션 적용하기</title>

    <link rel="stylesheet" href="옵션적용하기.css">
</head>
<body>
    <table>
        <tr>
            <th>너비 :</th>
            <td>
                <input type="number" id="boxWidth">px
            </td>
            <th>높이 :</th>
            <td>
                <input type="number" id="boxHeight">px
            </td>
        </tr>

        <tr>
            <th>글자크기 :</th>
            <td>
                <input type="number" class="input">px
            </td>
            <th>글자굵기 :</th>
            <td>
                보통 <input type="radio" name="font-weight" class="input">
                굵게 <input type="radio" name="font-weight" class="input">
            </td>
        </tr>

        <tr>
            <th>글자색 :</th>
            <td>
                <input type="text" class="input">px
            </td>
            <th>배경색 :</th>
            <td>
                <input type="text" class="input">px
            </td>
        </tr>

        <tr>
            <th>가로정렬 :</th>
            <td>
                왼쪽 <input type="radio" name="col">
                가운데 <input type="radio" name="col">
                오른쪽 <input type="radio" name="col">
            </td>
        </tr>

        <tr>
            <th>세로정렬 :</th>
            <td>
                위 <input type="radio" name="row" class="input">
                가운데 <input type="radio" name="row" class="input">
                아래 <input type="radio" name="row" class="input">
            </td>
        </tr>

        <tr>
            <th>출력 문자열 :</th>
            <td>
                <input type="text" class="input">
            </td>
        </tr>
    </table>
    </div>

    <div id = result-contianer></div>
        <button id="applyBtn">적용하기</button>
        <div id="result">결과</div>
    </div>

    <script src="옵션적용하기.js"></script>
</body>
</html>
